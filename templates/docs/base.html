<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Elf - {% block title %}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#1d4ed8; --gold:#b7791f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:var(--ink); font-family:-apple-system,'Inter','Segoe UI',sans-serif; line-height:1.65; }
  .doc { max-width:880px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  .doc h1 { font-size:2rem; margin:.2rem 0 .4rem; letter-spacing:-.02em; }
  .doc .lede { color:var(--muted); font-size:1.05rem; margin-bottom:1.5rem; }
  .doc h2 { font-size:1.4rem; margin:2.4rem 0 .5rem; padding-top:.5rem; border-top:1px solid var(--line); }
  .doc h3 { font-size:1.08rem; margin:1.6rem 0 .3rem; }
  .doc p, .doc li { font-size:.97rem; } .doc li { margin:.25rem 0; }
  .doc a { color:var(--accent); }
  .doc code { background:#eef2f7; padding:.1em .35em; border-radius:4px; font-size:.88em; }
  .formula { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:.9rem 1.1rem; margin:.8rem 0; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:.9rem; overflow-x:auto; white-space:pre; }
  .formula b { color:#fbbf24; font-weight:600; }
  .example { background:#fffbeb; border:1px solid #f3e3b0; border-left:4px solid var(--gold); border-radius:8px; padding:.9rem 1.1rem; margin:1rem 0; }
  .example h4 { margin:0 0 .4rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); }
  .example p { margin:.35rem 0; }
  .note { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:.7rem 1rem; margin:1rem 0; font-size:.92rem; }
  table.t { border-collapse:collapse; width:100%; margin:.8rem 0; font-size:.88rem; background:#fff; }
  table.t th, table.t td { border:1px solid var(--line); padding:.4rem .6rem; text-align:left; vertical-align:top; }
  table.t th { background:#f1f5f9; }
  table.t td.n, table.t th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .toc { background:#fff; border:1px solid var(--line); border-radius:10px; padding:.8rem 1.2rem; margin:1rem 0; }
  .toc ol { margin:.3rem 0; padding-left:1.2rem; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; margin:1.2rem 0; }
  .cards a { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:1.1rem; text-decoration:none; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .cards a:hover { border-color:var(--accent); }
  .cards b { display:block; font-size:1.05rem; margin-bottom:.3rem; color:var(--accent); } .cards span { font-size:.9rem; color:var(--muted); }
  .disclaimer { font-size:.82rem; color:var(--muted); margin-top:3rem; border-top:1px solid var(--line); padding-top:1rem; }
</style>
</head>
<body>
{% set brand_page = brand_page|default('') %}{% set brand_ticker = '' %}
{% include "layouts/_brand.html" %}
<main class="doc">
{% block body %}{% endblock %}
<p class="disclaimer">Stock Elf is an educational research tool. It uses public data that can be delayed, restated or wrong, and nothing here is investment advice.</p>
</main>
</body>
</html>
