<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Elf - {{ title }}</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#1d4ed8; --gold:#b7791f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:var(--ink); font-family:-apple-system,'Inter','Segoe UI',sans-serif; line-height:1.65; }
  .doc { max-width:880px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  .doc h1 { font-size:2rem; margin:.2rem 0 .4rem; letter-spacing:-.02em; }
  .doc .lede { color:var(--muted); font-size:1.05rem; margin-bottom:1.5rem; }
  .doc h2 { font-size:1.4rem; margin:2.4rem 0 .5rem; padding-top:.5rem; border-top:1px solid var(--line); }
  .doc h3 { font-size:1.08rem; margin:1.6rem 0 .3rem; }
  .doc p, .doc li { font-size:.97rem; } .doc li { margin:.25rem 0; }
  .doc a { color:var(--accent); }
  .doc code { background:#eef2f7; padding:.1em .35em; border-radius:4px; font-size:.88em; }
  .doc pre { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:.9rem 1.1rem; margin:.8rem 0; overflow-x:auto; line-height:1.5; }
  .doc pre code { background:none; padding:0; color:inherit; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:.9rem; }
  .doc blockquote { background:#fffbeb; border:1px solid #f3e3b0; border-left:4px solid var(--gold); border-radius:8px; padding:.5rem 1.1rem; margin:1rem 0; }
  .doc blockquote p { margin:.45rem 0; } .doc blockquote strong:only-child { color:var(--gold); text-transform:uppercase; letter-spacing:.06em; font-size:.8rem; }
  .doc table { border-collapse:collapse; width:100%; margin:.8rem 0; font-size:.88rem; background:#fff; display:block; overflow-x:auto; }
  .doc th, .doc td { border:1px solid var(--line); padding:.4rem .6rem; text-align:left; vertical-align:top; min-width:5.5rem; }
  .doc th { background:#f1f5f9; }
  .doc blockquote table { background:#fff; }
  .doc hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  .disclaimer { font-size:.82rem; color:var(--muted); margin-top:3rem; border-top:1px solid var(--line); padding-top:1rem; }
</style>
</head>
<body>
{% set brand_ticker = '' %}
{% include "layouts/_brand.html" %}
<main class="doc">
{{ content|safe }}
<p class="disclaimer">Stock Elf is an educational research tool. It uses public data that can be delayed, restated or wrong, and nothing here is investment advice.</p>
</main>
</body>
</html>
